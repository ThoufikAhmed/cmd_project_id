version: 0.2

phases:
  install:
    runtime-versions:
      docker: 19
  pre_build:
    commands:
      - echo "Logging into Docker"
      - docker login -u $dockerhub_username -p $dockerhub_password
      - echo "Logging in to Amazon ECR"
      - $(aws ecr get-login --region $AWS_DEFAULT_REGION --no-include-email)
      - REPOSITORY_URI=135632898485.dkr.ecr.ap-south-1.amazonaws.com/fabtrakr-server-node-image
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
  build:
    commands:
      - echo Build started on `date`
      - echo "Building the docker image"
      - docker build . -t $REPOSITORY_URI:latest
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Running unit tests
      - docker run $REPOSITORY_URI:latest npm run unit-test
      - echo "Pushing the docker images to the repository"
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Writing image definition file"
      - printf '[{"name":"fabtrakr-server-docker-container","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:  imagedefinitions.json
