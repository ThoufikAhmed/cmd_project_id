version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 10
  pre_build:
    commands:
      - echo "Installing NPM dependencies"
      - npm install

  post_build:
    commands:
      - echo "Creating the zip file"
      - zip -r function.zip ./testRunner.js ./src ./test ./node_modules > /dev/null 2>&1
      - aws lambda update-function-code --function-name fabtrakr-tests-runner --zip-file fileb://function.zip
